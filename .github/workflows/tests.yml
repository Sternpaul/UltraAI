name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "pr/**"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        # .[dev,test] = base + pytest + the light pipeline deps (numpy, scipy, pyphen,
        # soundfile, scikit-learn). No torch: align.py imports it lazily, so the suite
        # runs without the multi-GB worker wheel. Worker extras are audited in the
        # Docker image build (PR-06).
        run: python -m pip install -e .[dev,test]
      - name: pytest
        run: python -m pytest -q

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e .[dev,test] pip-audit
      - name: audit installed environment
        run: python -m pip_audit --desc --skip-editable
