<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UltraAI Review</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #2563eb; --sung: #16a34a; --warn: #d97706; --warn-bg: #fff4e0; --sel: #e8efff;
    --golden: #b45309; --free: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --text: #ececf0; --muted: #9a9aa3; --line: #2e2e33;
      --accent: #60a5fa; --sung: #4ade80; --warn: #fbbf24; --warn-bg: #3a2c10; --sel: #1f2a44;
      --golden: #fbbf24; --free: #c4b5fd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: grid; grid-template-columns: minmax(220px, 300px) 1fr; height: 100dvh; }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside button { all: unset; display: flex; gap: 8px; justify-content: space-between; width: 100%;
                 padding: 9px 16px; cursor: pointer; box-sizing: border-box; }
  aside button:hover, aside button:focus-visible { background: var(--sel); }
  aside button[aria-current="true"] { background: var(--sel); font-weight: 600; }
  .badge { font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--warn-bg); color: var(--warn);
           white-space: nowrap; align-self: center; }
  .badge.ok { background: transparent; color: var(--muted); }
  main { display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; }
  header { padding: 14px 20px 8px; }
  header h2 { margin: 0 0 8px; font-size: 18px; }
  header .meta { color: var(--muted); font-size: 13px; }
  audio { width: 100%; margin-top: 8px; }
  .karaoke { padding: 18px 20px; background: var(--panel); border-block: 1px solid var(--line); min-height: 112px; }
  .karaoke .cur { font-size: 28px; font-weight: 600; min-height: 40px; }
  .karaoke .next { font-size: 18px; color: var(--muted); min-height: 26px; margin-top: 6px; }
  .syl.done { color: var(--sung); }
  .syl.now { color: var(--accent); text-decoration: underline; text-underline-offset: 6px; }
  .syl.golden { color: var(--golden); }
  .syl.F { font-style: italic; }
  .list { overflow: auto; padding: 0 8px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr { cursor: pointer; }
  tr.review td:first-child { box-shadow: inset 3px 0 var(--warn); }
  tr.review .text::after { content: " ⚠ check"; color: var(--warn); font-size: 12px; }
  tr.sel { background: var(--sel); }
  tr.playing td.text { font-weight: 600; }
  td.time { color: var(--muted); font-variant-numeric: tabular-nums; width: 64px; }
  td.shift { width: 70px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
  td.btns { width: 1%; white-space: nowrap; }
  td.btns button, footer button { font: inherit; font-size: 13px; padding: 3px 8px; border-radius: 6px;
                                  border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  td.btns button:hover, footer button:hover { border-color: var(--accent); }
  footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 20px;
           border-top: 1px solid var(--line); background: var(--panel); }
  footer .spacer { flex: 1; }
  footer .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  footer .status { color: var(--muted); font-size: 13px; }
  .keys { color: var(--muted); font-size: 12px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
  .empty { padding: 40px 20px; color: var(--muted); }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: 30dvh 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<aside>
  <h1>Songs <span class="keys">(most flagged first)</span></h1>
  <ul id="songs"></ul>
</aside>
<main>
  <header>
    <h2 id="title">Pick a song</h2>
    <div class="meta" id="meta"></div>
    <audio id="audio" controls preload="auto"></audio>
  </header>
  <section class="karaoke" aria-live="off">
    <div class="cur" id="cur"></div>
    <div class="next" id="next"></div>
  </section>
  <div class="list"><table><tbody id="lines"></tbody></table><div class="empty" id="empty">No song loaded.</div></div>
  <footer>
    <span>Whole song:</span>
    <button data-global="-50">−50 ms</button>
    <button data-global="-10">−10 ms</button>
    <button data-global="10">+10 ms</button>
    <button data-global="50">+50 ms</button>
    <span id="global" class="status"></span>
    <span class="spacer"></span>
    <span class="keys"><kbd>Space</kbd> play · <kbd>↑</kbd><kbd>↓</kbd> line · <kbd>←</kbd><kbd>→</kbd> nudge 25 ms (<kbd>Shift</kbd> 100) · <kbd>Enter</kbd> replay line · <kbd>S</kbd> save</span>
    <button id="reset">Discard</button>
    <button id="save" class="primary">Save</button>
    <span id="status" class="status" role="status"></span>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const audio = $("audio");
let song = null, selected = -1, shifts = {}, globalMs = 0, songId = null;

async function loadSongs() {
  const res = await fetch("/api/songs");
  const items = await res.json();
  const ul = $("songs");
  ul.replaceChildren(...items.map((s) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.dataset.id = s.id;
    if (s.id === songId) b.setAttribute("aria-current", "true");
    const name = document.createElement("span");
    name.textContent = s.id + (s.edited ? " ✎" : "");
    const badge = document.createElement("span");
    badge.className = "badge" + (s.review ? "" : " ok");
    badge.textContent = s.review ? `${s.review} to check` : "ok";
    b.append(name, badge);
    b.addEventListener("click", () => openSong(s.id));
    li.append(b);
    return li;
  }));
}

async function openSong(id, keepTime = false) {
  const t = audio.currentTime;
  const res = await fetch("/api/song?id=" + encodeURIComponent(id));
  song = await res.json();
  songId = id; shifts = {}; globalMs = 0; selected = -1;
  $("title").textContent = `${song.artist} – ${song.title}`;
  $("meta").textContent = `${song.lines.length} lines · ${song.lines.filter((l) => l.review).length} flagged · lyrics: ${song.lyrics_source ?? "?"} · BPM ${song.bpm.toFixed(2)} · GAP ${Math.round(song.gap)} ms`;
  if (!audio.src.endsWith(song.audio)) audio.src = song.audio;
  if (keepTime) audio.currentTime = t;
  document.querySelectorAll("#songs button").forEach((b) => b.toggleAttribute("aria-current", b.dataset.id === id));
  renderLines();
  $("status").textContent = "";
}

function lineShift(i) { return ((shifts[i] ?? 0) + globalMs) / 1000; }

function fmt(t) { const m = Math.floor(t / 60); return `${m}:${(t - m * 60).toFixed(1).padStart(4, "0")}`; }

function renderLines() {
  const tb = $("lines");
  $("empty").hidden = !!song;
  tb.replaceChildren(...song.lines.map((l, i) => {
    const tr = document.createElement("tr");
    tr.dataset.i = i;
    tr.className = (l.review ? "review " : "") + (i === selected ? "sel" : "");
    const time = Object.assign(document.createElement("td"), { className: "time", textContent: fmt(l.start + lineShift(i)) });
    const text = Object.assign(document.createElement("td"), { className: "text", textContent: l.text });
    const sh = Object.assign(document.createElement("td"), { className: "shift", textContent: shifts[i] ? `${shifts[i] > 0 ? "+" : ""}${shifts[i]} ms` : "" });
    const btns = document.createElement("td");
    btns.className = "btns";
    for (const d of [-100, -25, 25, 100]) {
      const b = document.createElement("button");
      b.textContent = (d > 0 ? "+" : "−") + Math.abs(d);
      b.title = `move this line ${d > 0 ? "later" : "earlier"} by ${Math.abs(d)} ms`;
      b.addEventListener("click", (e) => { e.stopPropagation(); nudge(i, d); });
      btns.append(b);
    }
    tr.append(time, text, sh, btns);
    tr.addEventListener("click", () => { select(i); playLine(i); });
    return tr;
  }));
  $("global").textContent = globalMs ? `${globalMs > 0 ? "+" : ""}${globalMs} ms` : "";
}

function select(i) {
  if (!song) return;
  selected = Math.max(0, Math.min(song.lines.length - 1, i));
  document.querySelectorAll("#lines tr").forEach((tr) => tr.classList.toggle("sel", +tr.dataset.i === selected));
  document.querySelector(`#lines tr[data-i="${selected}"]`)?.scrollIntoView({ block: "nearest" });
}

function playLine(i) {
  const l = song.lines[i];
  audio.currentTime = Math.max(0, l.start + lineShift(i) - 1.0);
  audio.play();
}

function nudge(i, ms) {
  shifts[i] = (shifts[i] ?? 0) + ms;
  if (!shifts[i]) delete shifts[i];
  renderLines();
  $("status").textContent = "unsaved changes";
}

function renderKaraoke() {
  if (!song) return;
  const t = audio.currentTime;
  let cur = song.lines.findIndex((l, i) => t < l.end + lineShift(i) + 0.3 && (i + 1 >= song.lines.length || t < song.lines[i + 1].start + lineShift(i + 1) - 0.1));
  if (cur < 0) cur = song.lines.length - 1;
  const line = song.lines[cur];
  const s = lineShift(cur);
  const cd = $("cur");
  if (cd.dataset.i !== String(cur)) {
    cd.dataset.i = cur;
    cd.replaceChildren(...line.notes.map((n) => {
      const sp = document.createElement("span");
      sp.className = "syl" + (n.kind === "*" ? " golden" : "") + (n.kind === "F" ? " F" : "");
      sp.textContent = n.text.trim() === "~" ? "" : n.text.replace(/^~/, "");
      return sp;
    }));
    $("next").textContent = song.lines[cur + 1]?.text ?? "";
    document.querySelectorAll("#lines tr").forEach((tr) => tr.classList.toggle("playing", +tr.dataset.i === cur));
  }
  [...cd.children].forEach((sp, k) => {
    const n = line.notes[k];
    sp.classList.toggle("done", t >= n.end + s);
    sp.classList.toggle("now", t >= n.start + s && t < n.end + s);
  });
}

function loop() { renderKaraoke(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

async function save() {
  if (!song) return;
  $("status").textContent = "saving…";
  const res = await fetch("/api/save", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: songId, line_shifts_ms: shifts, global_ms: globalMs }),
  });
  const out = await res.json();
  if (!res.ok) { $("status").textContent = "error: " + (out.error ?? res.status); return; }
  await openSong(songId, true);
  await loadSongs();
  $("status").textContent = out.issues.length ? `saved, ${out.issues.length} warning(s): ${out.issues[0]}` : "saved ✓ (original kept as .txt.bak)";
}

document.querySelectorAll("[data-global]").forEach((b) => b.addEventListener("click", () => {
  globalMs += +b.dataset.global; renderLines(); $("status").textContent = "unsaved changes";
}));
$("save").addEventListener("click", save);
$("reset").addEventListener("click", () => { if (songId) openSong(songId, true); });

document.addEventListener("keydown", (e) => {
  if (!song || e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const step = e.shiftKey ? 100 : 25;
  switch (e.key) {
    case " ": e.preventDefault(); audio.paused ? audio.play() : audio.pause(); break;
    case "ArrowDown": e.preventDefault(); select(selected + 1); break;
    case "ArrowUp": e.preventDefault(); select(selected - 1); break;
    case "ArrowLeft": if (selected >= 0) { e.preventDefault(); nudge(selected, -step); } break;
    case "ArrowRight": if (selected >= 0) { e.preventDefault(); nudge(selected, step); } break;
    case "Enter": if (selected >= 0) { e.preventDefault(); playLine(selected); } break;
    case "s": case "S": e.preventDefault(); save(); break;
  }
});

window.addEventListener("beforeunload", (e) => {
  if (Object.keys(shifts).length || globalMs) e.preventDefault();
});

loadSongs();
</script>
</body>
</html>
